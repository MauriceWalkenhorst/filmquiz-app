[build]
builder = "nixpacks"

[build.nixpacks]
# Explicitly set Node version
node-version = "20"

[deploy]
startCommand = "cd backend && npm install && npm run init-db && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
