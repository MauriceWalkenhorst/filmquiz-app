version: '3.8'

services:
  filmquiz:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: filmquiz-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - filmquiz-data:/app/src/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  filmquiz-data:
